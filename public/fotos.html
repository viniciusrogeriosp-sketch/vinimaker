<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Suas fotos · VINIMAKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c0c;--fg:#f4f2ee;--mut:#9a9792;--card:#17191a;--ac:#e8ff5a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
header{padding:28px 16px 18px;max-width:1100px;margin:0 auto}
.vm{font-weight:800;letter-spacing:.02em;font-size:22px;display:inline-block;border-bottom:3px solid var(--fg);padding-bottom:2px}
h1{font-weight:800;font-size:clamp(28px,7vw,44px);line-height:1.05;margin-top:22px}
h1 span{display:block;font-weight:300}
.sub{color:var(--mut);margin-top:10px;font-size:15px;line-height:1.5}
.bar{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:500;background:var(--fg);color:var(--bg);border:0;border-radius:999px;padding:11px 18px;font-size:14px;text-decoration:none;cursor:pointer;display:inline-block}
.btn.out{background:transparent;color:var(--fg);border:1px solid #3a3c3d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding:0 16px 40px;max-width:1100px;margin:0 auto}
.grid a{aspect-ratio:4/3;background:var(--card);border-radius:8px;overflow:hidden;display:block}
.grid img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s}
.grid img.ok{opacity:1}
.msg{max-width:560px;margin:10vh auto 0;padding:0 16px}
.msg h2{font-weight:800;font-size:30px;line-height:1.1}
.msg p{color:var(--mut);margin:14px 0 22px;line-height:1.55}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:9}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:72vh;border-radius:6px}
.lb .acts{display:flex;gap:10px;margin-top:16px}
.lb .x{position:absolute;top:12px;right:14px;background:none;color:var(--fg);font-size:30px;padding:6px 10px}
footer{border-top:1px solid #222;padding:26px 16px 40px;max-width:1100px;margin:0 auto;color:var(--mut);font-size:14px;line-height:1.6}
footer b{color:var(--fg)}
.load{color:var(--mut);padding:40px 16px;text-align:center}
</style>
</head>
<body>
<div id="app"><p class="load">Carregando suas fotos…</p></div>

<div class="lb" id="lb" role="dialog" aria-modal="true">
  <button class="x" id="lbx" aria-label="Fechar">×</button>
  <img id="lbimg" alt="">
  <div class="acts">
    <a class="btn" id="lbdl" target="_blank" rel="noopener">Baixar em alta</a>
    <button class="btn out" id="lbnext">Próxima</button>
  </div>
</div>

<script>
const IG = "https://ig.me/m/vinimakeraudiovisual";
const id = (location.pathname.match(/\/f\/([0-9]+)/) || [])[1] || "";
const app = document.getElementById("app");
let fotos = [], atual = 0;
const mini = (p) => `/api/miniatura?id=${id}&p=${encodeURIComponent(p)}`;
const alta = (p) => `/api/foto?id=${id}&p=${encodeURIComponent(p)}`;

function bloqueado(motivo){
  const repassado = motivo === "repassado";
  app.innerHTML = `<div class="msg"><span class="vm">VM</span>
    <h2 style="margin-top:22px">${repassado ? "Esse link é pessoal." : "Link inválido."}</h2>
    <p>${repassado
      ? "Ele já foi aberto em outro celular. Para receber o seu próprio link das fotos do torneio, mande a palavra <b>FOTOS</b> no direct da @vinimakeraudiovisual."
      : "Para receber o link das fotos do torneio, mande a palavra <b>FOTOS</b> no direct da @vinimakeraudiovisual."}</p>
    <a class="btn" href="${IG}">Abrir o direct da VINIMAKER</a></div>`;
}

function render(){
  app.innerHTML = `<header><span class="vm">VM</span>
    <h1>Suas fotos<span>do torneio.</span></h1>
    <p class="sub">Beach Tennis · Hípica Campinas. Toque numa foto para ver e baixar em alta. As fotos vão chegando durante o evento.</p>
    <div class="bar"><button id="atu">Atualizar fotos</button><span class="sub" style="margin:0">${fotos.length} fotos</span></div>
  </header>
  <div class="grid" id="grid"></div>
  <footer><b>VINIMAKER Audiovisual</b><br>Sua marca ou evento quer uma cobertura assim? <a href="${IG}" style="color:var(--fg)">Fale com a gente no direct</a>.</footer>`;
  const g = document.getElementById("grid");
  if (!fotos.length) g.outerHTML = `<p class="load">As primeiras fotos ainda estão chegando. Volte daqui a pouco e toque em “Atualizar fotos”.</p>`;
  const dias = [...new Set(fotos.map((f) => f.d))];
  if (g && dias.length > 1) {
    const nav = document.createElement("div");
    nav.className = "bar"; nav.style.padding = "0 16px 14px"; nav.style.maxWidth = "1100px"; nav.style.margin = "0 auto";
    dias.forEach((d) => { const b = document.createElement("button"); b.className = "btn out"; b.textContent = d || "Outras"; b.onclick = () => document.getElementById("dia-" + dias.indexOf(d)).scrollIntoView({ behavior: "smooth" }); nav.appendChild(b); });
    g.before(nav);
  }
  let diaAtual = null;
  fotos.forEach((f, i) => {
    if (g && dias.length > 1 && f.d !== diaAtual) {
      diaAtual = f.d;
      const h = document.createElement("h2");
      h.id = "dia-" + dias.indexOf(f.d); h.textContent = f.d || "Outras";
      h.style.cssText = "grid-column:1/-1;font-weight:800;font-size:22px;margin:18px 0 6px";
      g.appendChild(h);
    }
    const a = document.createElement("a");
    a.href = alta(f.p);
    a.onclick = (e) => { e.preventDefault(); abrir(i); };
    const im = new Image();
    im.loading = "lazy"; im.alt = f.n; im.src = mini(f.p);
    im.onload = () => im.classList.add("ok");
    a.appendChild(im); g && g.appendChild(a);
  });
  document.getElementById("atu").onclick = carregar;
}

function abrir(i){
  atual = (i + fotos.length) % fotos.length;
  const f = fotos[atual];
  document.getElementById("lbimg").src = mini(f.p);
  document.getElementById("lbdl").href = alta(f.p);
  document.getElementById("lb").classList.add("on");
}
document.getElementById("lbx").onclick = () => document.getElementById("lb").classList.remove("on");
document.getElementById("lbnext").onclick = () => abrir(atual + 1);

async function carregar(){
  if (!id) return bloqueado("link");
  try {
    const r = await fetch(`/api/fotos?id=${id}`, { credentials: "same-origin", cache: "no-store" });
    const d = await r.json();
    if (!d.ok) return d.motivo === "erro"
      ? (app.innerHTML = `<p class="load">Não consegui carregar agora. Tente de novo em instantes.</p>`)
      : bloqueado(d.motivo);
    const ordem = (x) => (/s[aá]b/i.test(x) ? "0" : /dom/i.test(x) ? "1" : "2") + x;
    fotos = d.fotos.sort((a, b) => (ordem(a.d) === ordem(b.d) ? 0 : ordem(a.d) < ordem(b.d) ? -1 : 1)); render();
  } catch { app.innerHTML = `<p class="load">Sem conexão. Tente de novo em instantes.</p>`; }
}
carregar();
</script>
</body>
</html>
